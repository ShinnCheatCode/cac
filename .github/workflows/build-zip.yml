name: Build CAC IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      # 1. CHECKOUT
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      # 2. SHOW REPOSITORY FILES
      - name: Show repo files
        shell: bash
        run: |
          set -euo pipefail
          echo "REPOSITORY FILES"
          pwd
          ls -lah
          find . -maxdepth 3 -type f -iname "*.zip" -print || true

      # 3. EXTRACT source.zip
      - name: Extract source.zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP=$(find . -maxdepth 3 -type f -iname "source.zip" | head -1)

          if [ -z "${ZIP:-}" ]; then
            echo "❌ Không tìm thấy source.zip"
            exit 1
          fi

          SRC="$RUNNER_TEMP/source"
          rm -rf "$SRC"
          mkdir -p "$SRC"

          unzip -q -o "$ZIP" -d "$SRC"
          find "$SRC" -maxdepth 5 -print | head -300

      # 4. DETECT PROJECT
      - name: Detect Xcode project
        shell: bash
        run: |
          set -euo pipefail

          SRC="$RUNNER_TEMP/source"

          WORKSPACE=$(find "$SRC" -type d -name "*.xcworkspace" ! -path "*/Pods/*" | head -1)
          PROJECT=$(find "$SRC" -type d -name "*.xcodeproj" ! -path "*/Pods/*" | head -1)

          if [ -z "${WORKSPACE:-}" ] && [ -z "${PROJECT:-}" ]; then
            echo "❌ Không tìm thấy project"
            exit 1
          fi

          if [ -n "${WORKSPACE:-}" ]; then
            echo "USE_WORKSPACE=1" >> $GITHUB_ENV
            echo "WORKSPACE=$WORKSPACE" >> $GITHUB_ENV
            ROOT=$(dirname "$WORKSPACE")
          else
            echo "USE_WORKSPACE=0" >> $GITHUB_ENV
            echo "PROJECT=$PROJECT" >> $GITHUB_ENV
            ROOT=$(dirname "$PROJECT")
          fi

          echo "ROOT=$ROOT" >> $GITHUB_ENV

      # 5. SELECT XCODE
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      # 6. CLEAN
      - name: Clean DerivedData
        run: rm -rf ~/Library/Developer/Xcode/DerivedData/*

      # 7. SHOW PROJECT
      - name: Show Xcode info
        shell: bash
        run: |
          cd "$ROOT"

          if [ "$USE_WORKSPACE" = "1" ]; then
            xcodebuild -list -workspace "$(basename "$WORKSPACE")"
          else
            xcodebuild -list -project "$(basename "$PROJECT")"
          fi

      # 8. SCHEME
      - name: Select scheme
        run: echo "SCHEME=3105" >> $GITHUB_ENV

      # 9. ARCHIVE
      - name: Archive unsigned
        shell: bash
        run: |
          set -euo pipefail

          cd "$ROOT"

          ARCHIVE="$RUNNER_TEMP/CAC.xcarchive"
          rm -rf "$ARCHIVE"

          if [ "$USE_WORKSPACE" = "1" ]; then
            xcodebuild archive \
              -workspace "$(basename "$WORKSPACE")" \
              -scheme "$SCHEME" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath "$ARCHIVE" \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              DEVELOPMENT_TEAM="" \
              2>&1 | tee "$RUNNER_TEMP/build.log"
          else
            xcodebuild archive \
              -project "$(basename "$PROJECT")" \
              -scheme "$SCHEME" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath "$ARCHIVE" \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              DEVELOPMENT_TEAM="" \
              2>&1 | tee "$RUNNER_TEMP/build.log"
          fi

          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      # 10. FIND APP
      - name: Find built app
        shell: bash
        run: |
          APP=$(find "$ARCHIVE/Products/Applications" -name "*.app" | head -1)

          if [ -z "$APP" ]; then
            echo "❌ Không tìm thấy app"
            exit 1
          fi

          echo "APP=$APP" >> $GITHUB_ENV

      # 11. PACKAGE IPA
      - name: Package IPA
        shell: bash
        run: |
          PKG="$RUNNER_TEMP/ipa"

          rm -rf "$PKG"
          mkdir -p "$PKG/Payload"

          cp -R "$APP" "$PKG/Payload/"

          cd "$PKG"

          zip -qry "$GITHUB_WORKSPACE/CAC.ipa" Payload

          ls -lh "$GITHUB_WORKSPACE/CAC.ipa"

      # 12. VERIFY
      - name: Verify IPA
        run: |
          unzip -l "$GITHUB_WORKSPACE/CAC.ipa" | head

      # 13. UPLOAD
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CAC-IPA
          path: CAC.ipa
          if-no-files-found: error

      # 14. BUILD LOG
      - name: Upload Build Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CAC-Build-Log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore