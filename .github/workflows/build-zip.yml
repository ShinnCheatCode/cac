- name: Extract 1234.zip
  shell: bash
  run: |
    set -euo pipefail

    ZIP=$(find . -maxdepth 2 -type f -iname "1234.zip" | head -1)

    if [ -z "$ZIP" ]; then
      echo "❌ 1234.zip not found"
      exit 1
    fi

    echo "Found: $ZIP"

    mkdir -p "$RUNNER_TEMP/source"

    # Dùng ditto thay vì unzip
    ditto -x -k "$ZIP" "$RUNNER_TEMP/source"

    echo "✅ Extract completed"