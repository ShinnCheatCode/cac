name: Build Shinn IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  build:

    runs-on: macos-14
    timeout-minutes: 60

    steps:

    - name: Checkout latest code
      uses: actions/checkout@v4
      with:
        clean: true
        fetch-depth: 0


    - name: Show files
      run: |
        ls -lah
        echo "ZIP LIST:"
        find . -maxdepth 1 -name "*.zip"


    - name: Extract ZIP
      shell: bash
      run: |

        set -e

        ZIP="./Shinn.zip"

        if [ ! -f "$ZIP" ]; then
          echo "Không tìm thấy Shinn.zip"
          exit 1
        fi


        rm -rf "$RUNNER_TEMP/source"

        mkdir -p "$RUNNER_TEMP/source"


        unzip -o "$ZIP" \
        -d "$RUNNER_TEMP/source"


        echo "SOURCE:"
        find "$RUNNER_TEMP/source" -maxdepth 2


        PROJECT=$(find "$RUNNER_TEMP/source" \
        -name "*.xcodeproj" \
        | head -1)


        if [ -z "$PROJECT" ]; then
          echo "Không tìm thấy xcode project"
          exit 1
        fi


        echo "PROJECT=$PROJECT" >> $GITHUB_ENV
        echo "ROOT=$(dirname "$PROJECT")" >> $GITHUB_ENV



    - name: Clean Xcode
      run: |

        rm -rf ~/Library/Developer/Xcode/DerivedData/*



    - name: Build IPA

      shell: bash

      run: |

        cd "$ROOT"


        xcodebuild \
        -project "$(basename "$PROJECT")" \
        -scheme 3105 \
        -configuration Release \
        -sdk iphoneos \
        -destination generic/platform=iOS \
        -derivedDataPath "$RUNNER_TEMP/build" \
        CODE_SIGNING_ALLOWED=NO \
        CODE_SIGNING_REQUIRED=NO \
        build



    - name: Package IPA

      run: |

        APP=$(find "$RUNNER_TEMP/build" \
        -name "*.app" \
        | head -1)


        if [ -z "$APP" ]; then
          echo "Không tìm thấy app"
          exit 1
        fi


        mkdir -p Payload

        cp -R "$APP" Payload/


        zip -r Shinn-new.ipa Payload



    - name: Upload IPA

      uses: actions/upload-artifact@v4

      with:

        name: Shinn-new-IPA

        path: Shinn-new.ipa