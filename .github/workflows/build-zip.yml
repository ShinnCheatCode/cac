name: Build ShinnCheat IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Show repo files
        run: |
          set -euo pipefail

          echo "=== ROOT FILES ==="
          ls -lah

          echo ""
          echo "=== ZIP FILES ==="
          find . -maxdepth 3 -type f -iname "*.zip" -print

      - name: Extract source.zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP=""

          # Tìm source.zip không phân biệt chữ hoa/thường
          while IFS= read -r file; do
            ZIP="$file"
            break
          done < <(find . -maxdepth 3 -type f -iname "source.zip" -print)

          if [ -z "${ZIP:-}" ]; then
            echo "❌ Không tìm thấy source.zip"
            echo ""
            echo "Các file ZIP hiện có:"
            find . -maxdepth 3 -type f -iname "*.zip" -print || true
            echo ""
            echo "Hãy đặt source.zip ở thư mục gốc repository."
            exit 1
          fi

          echo "✅ Found source archive:"
          echo "$ZIP"

          SRC="$RUNNER_TEMP/source"
          rm -rf "$SRC"
          mkdir -p "$SRC"

          echo ""
          echo "=== EXTRACTING ==="
          unzip -q -o "$ZIP" -d "$SRC"

          echo ""
          echo "=== SOURCE TREE ==="
          find "$SRC" -maxdepth 5 -print | head -300

          echo ""
          echo "=== SEARCH XCODE PROJECT ==="

          WORKSPACE=$(find "$SRC" \
            -type d \
            -name "*.xcworkspace" \
            ! -path "*/Pods/*" \
            | head -1 || true)

          PROJECT=$(find "$SRC" \
            -type d \
            -name "*.xcodeproj" \
            ! -path "*/Pods/*" \
            | head -1 || true)

          if [ -z "${PROJECT:-}" ] && [ -z "${WORKSPACE:-}" ]; then
            echo "❌ Không tìm thấy .xcodeproj hoặc .xcworkspace trong source.zip"
            exit 1
          fi

          if [ -n "${WORKSPACE:-}" ]; then
            ROOT=$(dirname "$WORKSPACE")

            echo "USE_WORKSPACE=1" >> "$GITHUB_ENV"
            echo "WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"
            echo "PROJECT=${PROJECT:-}" >> "$GITHUB_ENV"
          else
            ROOT=$(dirname "$PROJECT")

            echo "USE_WORKSPACE=0" >> "$GITHUB_ENV"
            echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          fi

          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

          echo ""
          echo "=== BUILD CONFIGURATION ==="
          echo "ROOT=$ROOT"
          echo "WORKSPACE=${WORKSPACE:-none}"
          echo "PROJECT=${PROJECT:-none}"

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Clean DerivedData
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData/*

      - name: Detect scheme
        shell: bash
        run: |
          set -euo pipefail

          cd "$ROOT"

          echo "=== XCODE LIST ==="

          if [ "${USE_WORKSPACE}" = "1" ]; then
            LIST=$(xcodebuild -list -workspace "$(basename "$WORKSPACE")")
          else
            LIST=$(xcodebuild -list -project "$(basename "$PROJECT")")
          fi

          echo "$LIST"

          echo ""
          echo "=== DETECT SCHEME ==="

          SCHEME=$(echo "$LIST" | awk '
            /Schemes:/ {
              found=1
              next
            }
            found && NF {
              gsub(/^[ \t]+|[ \t]+$/, "", $0)
              print
              exit
            }
          ')

          PREFERRED=$(echo "$LIST" | awk '
            /Schemes:/ {
              found=1
              next
            }
            found && NF {
              gsub(/^[ \t]+|[ \t]+$/, "", $0)

              if (
                tolower($0) ~ /shinn/ ||
                tolower($0) ~ /3105/
              ) {
                print
                exit
              }
            }
          ')

          if [ -n "${PREFERRED:-}" ]; then
            SCHEME="$PREFERRED"
          fi

          if [ -z "${SCHEME:-}" ]; then
            echo "❌ Không detect được scheme"
            exit 1
          fi

          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"

          echo "✅ Detected scheme:"
          echo "$SCHEME"

      - name: Archive unsigned
        shell: bash
        run: |
          set -euo pipefail

          cd "$ROOT"

          ARCHIVE="$RUNNER_TEMP/ShinnCheat.xcarchive"

          rm -rf "$ARCHIVE"

          COMMON=(
            -scheme "$SCHEME"
            -configuration Release
            -destination "generic/platform=iOS"
            -archivePath "$ARCHIVE"

            CODE_SIGN_IDENTITY=""
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGNING_ALLOWED=NO
            DEVELOPMENT_TEAM=""

            -allowProvisioningUpdates=NO
          )

          echo "=== BUILD START ==="
          echo "Scheme: $SCHEME"
          echo "Root: $ROOT"

          if [ "${USE_WORKSPACE}" = "1" ]; then

            xcodebuild archive \
              -workspace "$(basename "$WORKSPACE")" \
              "${COMMON[@]}" \
              | tee "$RUNNER_TEMP/build.log"

          else

            xcodebuild archive \
              -project "$(basename "$PROJECT")" \
              "${COMMON[@]}" \
              | tee "$RUNNER_TEMP/build.log"

          fi

          echo ""
          echo "=== ARCHIVE COMPLETE ==="

          if [ ! -d "$ARCHIVE" ]; then
            echo "❌ Archive không tồn tại"
            exit 1
          fi

          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Find built app
        shell: bash
        run: |
          set -euo pipefail

          echo "=== SEARCH APP ==="

          find "$ARCHIVE/Products/Applications" \
            -maxdepth 2 \
            -name "*.app" \
            -print

          APP=$(find "$ARCHIVE/Products/Applications" \
            -maxdepth 2 \
            -name "*.app" \
            | head -1)

          if [ -z "${APP:-}" ]; then
            echo "❌ Không tìm thấy .app trong archive"
            find "$ARCHIVE" | head -200
            exit 1
          fi

          echo "APP=$APP" >> "$GITHUB_ENV"

          echo ""
          echo "✅ APP:"
          echo "$APP"

          echo ""
          echo "=== APP INFO ==="
          ls -lah "$APP"

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${APP:-}" ]; then
            echo "❌ APP chưa được xác định"
            exit 1
          fi

          PKG="$RUNNER_TEMP/ipa"

          rm -rf "$PKG"

          mkdir -p "$PKG/Payload"

          cp -R "$APP" "$PKG/Payload/"

          cd "$PKG"

          echo "=== CREATE IPA ==="

          zip -qry \
            "$GITHUB_WORKSPACE/ShinnCheat.ipa" \
            Payload

          echo ""
          echo "=== IPA CREATED ==="

          ls -lah "$GITHUB_WORKSPACE/ShinnCheat.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShinnCheat-IPA
          path: ShinnCheat.ipa
          if-no-files-found: error

      - name: Upload Build Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ShinnCheat-Build-Log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore