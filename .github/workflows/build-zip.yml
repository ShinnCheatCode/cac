name: Build 123 IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Extract 123.zip
        shell: bash
        run: |
          set -e

          ZIP=$(find . -type f -iname "123.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "123.zip not found"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/src"
          unzip -q -o "$ZIP" -d "$RUNNER_TEMP/src"

      - name: Detect project
        shell: bash
        run: |
          set -e

          SRC="$RUNNER_TEMP/src"

          WORKSPACE=$(find "$SRC" -name "*.xcworkspace" | head -1)
          PROJECT=$(find "$SRC" -name "*.xcodeproj" | head -1)

          if [ -n "$WORKSPACE" ]; then
            ROOT=$(dirname "$WORKSPACE")
            echo "USE_WORKSPACE=1" >> $GITHUB_ENV
            echo "WORKSPACE=$WORKSPACE" >> $GITHUB_ENV
          else
            ROOT=$(dirname "$PROJECT")
            echo "USE_WORKSPACE=0" >> $GITHUB_ENV
            echo "PROJECT=$PROJECT" >> $GITHUB_ENV
          fi

          echo "ROOT=$ROOT" >> $GITHUB_ENV

      - name: Detect scheme
        shell: bash
        run: |
          cd "$ROOT"

          if [ "$USE_WORKSPACE" = "1" ]; then
            SCHEME=$(xcodebuild -list -workspace "$(basename "$WORKSPACE")" | awk '/Schemes:/{getline; print $1}')
          else
            SCHEME=$(xcodebuild -list -project "$(basename "$PROJECT")" | awk '/Schemes:/{getline; print $1}')
          fi

          echo "SCHEME=$SCHEME" >> $GITHUB_ENV
          echo "Scheme: $SCHEME"

      - name: Archive
        shell: bash
        run: |
          cd "$ROOT"

          ARCHIVE="$RUNNER_TEMP/123.xcarchive"

          if [ "$USE_WORKSPACE" = "1" ]; then
            xcodebuild archive \
              -workspace "$(basename "$WORKSPACE")" \
              -scheme "$SCHEME" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath "$ARCHIVE" \
              CODE_SIGNING_ALLOWED=NO
          else
            xcodebuild archive \
              -project "$(basename "$PROJECT")" \
              -scheme "$SCHEME" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath "$ARCHIVE" \
              CODE_SIGNING_ALLOWED=NO
          fi

          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      - name: Create IPA
        shell: bash
        run: |
          APP=$(find "$ARCHIVE/Products/Applications" -name "*.app" | head -1)

          mkdir Payload
          cp -R "$APP" Payload/

          zip -qry 123.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 123-IPA
          path: 123.ipa