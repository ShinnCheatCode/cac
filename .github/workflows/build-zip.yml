name: Build 1234 IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Extract 1234.zip
        shell: bash
        run: |
          set -e

          ZIP=$(find . -type f -iname "1234.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "❌ 1234.zip not found"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/source"
          unzip -q -o "$ZIP" -d "$RUNNER_TEMP/source"

      - name: Detect Project
        shell: bash
        run: |
          set -e

          SRC="$RUNNER_TEMP/source"

          WORKSPACE=$(find "$SRC" -name "*.xcworkspace" | head -1)
          PROJECT=$(find "$SRC" -name "*.xcodeproj" | head -1)

          if [ -n "$WORKSPACE" ]; then
            ROOT=$(dirname "$WORKSPACE")
            echo "USE_WORKSPACE=1" >> $GITHUB_ENV
            echo "WORKSPACE=$WORKSPACE" >> $GITHUB_ENV
          else
            ROOT=$(dirname "$PROJECT")
            echo "USE_WORKSPACE=0" >> $GITHUB_ENV
            echo "PROJECT=$PROJECT" >> $GITHUB_ENV
          fi

          echo "ROOT=$ROOT" >> $GITHUB_ENV

      - name: Detect Scheme
        shell: bash
        run: |
          set -e
          cd "$ROOT"

          if [ "$USE_WORKSPACE" = "1" ]; then
            SCHEME=$(xcodebuild -list -workspace "$(basename "$WORKSPACE")" | awk '/Schemes:/{getline; print $1}')
          else
            SCHEME=$(xcodebuild -list -project "$(basename "$PROJECT")" | awk '/Schemes:/{getline; print $1}')
          fi

          echo "SCHEME=$SCHEME" >> $GITHUB_ENV
          echo "Using Scheme: $SCHEME"

      - name: Build Archive
        shell: bash
        run: |
          set -e
          cd "$ROOT"

          ARCHIVE="$RUNNER_TEMP/1234.xcarchive"

          if [ "$USE_WORKSPACE" = "1" ]; then
            xcodebuild archive \
              -workspace "$(basename "$WORKSPACE")" \
              -scheme "$SCHEME" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath "$ARCHIVE" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          else
            xcodebuild archive \
              -project "$(basename "$PROJECT")" \
              -scheme "$SCHEME" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath "$ARCHIVE" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          fi

          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      - name: Create IPA
        shell: bash
        run: |
          set -e

          APP=$(find "$ARCHIVE/Products/Applications" -name "*.app" | head -1)

          mkdir -p Payload
          cp -R "$APP" Payload/

          zip -qry 1234.ipa Payload

      - name: Verify IPA
        run: unzip -l 1234.ipa | head -30

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 1234-IPA
          path: 1234.ipa
          if-no-files-found: error