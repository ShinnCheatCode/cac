      - name: Unzip
        shell: bash
        run: |
          set -euo pipefail

          if [ -f ShinnV1.zip ]; then
            ZIP=ShinnV1.zip
          else
            ZIP=$(ls -1t *.zip | head -n 1)
          fi

          echo "ZIP=$ZIP"
          test -f "$ZIP"

          rm -rf "$RUNNER_TEMP/src"
          mkdir -p "$RUNNER_TEMP/src"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/src"

          PROJ=$(find "$RUNNER_TEMP/src" -name "*.xcodeproj" | head -n 1)
          test -n "$PROJ"

          ROOT=$(dirname "$PROJ")
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Found project: $PROJ"